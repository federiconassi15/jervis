[build-system]
requires = ["setuptools>=75", "wheel", "setuptools-rust>=1.10,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "jervis-assistant"
version = "7.3.1"
description = "Low-latency, cross-platform, always-on voice assistant powered by OpenClaw"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Federico Nassi"}]
dependencies = [
  "numpy>=1.26,<3",
  "platformdirs>=4.3,<5",
  "psutil>=6,<8",
  "sounddevice>=0.5,<1",
  "faster-whisper>=1.1,<2",
  "pocketsphinx>=5,<6",
  "edge-tts>=7,<8",
  "sherpa-onnx>=1.10,<2",
  "textual>=8.2.8,<9",
  "windows-curses>=2.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyyaml>=6,<7", "build>=1.2,<2"]

[project.scripts]
jervis = "jervis.cli:main"
jervis-installer = "jervis.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
