name: Bug report
description: Report a reproducible problem in Jervis
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Jervis. Do not include credentials, passphrases, voiceprints, private recordings, or private conversation logs.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Jervis
        2. Say ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jervis version
      placeholder: e.g. 7.1
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Debian 13 x86_64
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, personal data, and private transcripts before pasting logs.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, credentials, biometric data, and private conversation content.
          required: true
