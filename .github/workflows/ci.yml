name: CI

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Linux PortAudio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Jervis test environment
        run: python -m pip install -e ".[dev]"

      - name: Compile every Python file
        run: python -m compileall -q src tests scripts bootstrap.py install.py

      - name: Repository verifier
        run: python scripts/verify_repo.py

      - name: Smoke test
        run: python scripts/smoke.py

      - name: Unit tests
        run: python -m pytest

      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 src tests scripts bootstrap.py install.py

  release-artifact:
    name: Universal release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Build universal installer
        run: python scripts/build_release.py

      - name: Verify universal installer
        run: python scripts/verify_release.py

      - name: Verify bootstrap syntax
        run: python -m py_compile bootstrap.py install.py
