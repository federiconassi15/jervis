name: Android Companion (experimental)

on:
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build debug APK (do not publish)
        working-directory: android-companion
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Test pure Android/JVM code
        working-directory: android-companion
        run: gradle :app:testDebugUnitTest --no-daemon
