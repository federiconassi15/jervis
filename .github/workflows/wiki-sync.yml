name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wiki publish tree
        shell: python
        run: |
          from pathlib import Path
          import re, shutil

          src = Path("docs/wiki")
          out = Path("wiki-publish")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          repo = "${{ github.repository }}"
          for source in src.glob("*.md"):
              text = source.read_text(encoding="utf-8")

              # Retain original version facts on older pages and label them
              # as historical, rather than falsely relabeling 7.x as 8.x.
              current_pages = {
                  "Home.md", "_Sidebar.md", "_Footer.md",
                  "getting-started-index.md", "getting-started-installation.md",
                  "getting-started-updates.md", "installer-index.md",
                  "installer-overview.md", "development-index.md",
                  "development-versioning.md", "development-release-workflow.md",
                  "reference-cli.md",
              }
              if source.name not in current_pages and re.search(
                  r"Jervis 7\.[134]|7\.3\.1 hardening|7\.1 reliability line",
                  text, flags=re.IGNORECASE,
              ):
                  notice = (
                      "> **Historical Jervis 7.x documentation.** This page may "
                      "describe earlier interfaces. For Jervis 8 use "
                      "[installation](getting-started-installation.md), "
                      "[CLI reference](reference-cli.md), or "
                      "[8.0.1 release notes](https://github.com/" + repo
                      + "/blob/main/docs/releases/8.0.1.md).\n\n"
                  )
                  first, sep, rest = text.partition("\n")
                  text = first + sep + "\n" + notice + rest

              text = re.sub(
                  r'\]\((?!https?://)([A-Za-z0-9_-]+)\.md\)',
                  lambda m: "](" + m.group(1) + ")",
                  text,
              )
              text = re.sub(
                  r'\]\(\.\./([^\)]+\.md)\)',
                  lambda m: "](" + "https://github.com/" + repo + "/blob/main/docs/" + m.group(1) + ")",
                  text,
              )
              (out / source.name).write_text(text, encoding="utf-8")

      - name: Publish to GitHub Wiki
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          if ! git clone "$WIKI_URL" wiki; then
            echo "::error::GitHub Wiki is enabled but has not been initialized yet."
            echo "::error::Open https://github.com/${{ github.repository }}/wiki, create the first page once, then rerun this workflow."
            exit 1
          fi

          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a wiki-publish/. wiki/

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add -A

          if git -C wiki diff --cached --quiet; then
            echo "Wiki already current."
            exit 0
          fi

          git -C wiki commit -m "Sync wiki from docs/wiki"
          git -C wiki push origin HEAD:master
