name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".release-trigger"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Jervis version
        id: meta
        shell: python
        run: |
          import os
          import pathlib
          import re

          text = pathlib.Path("src/jervis/version.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("Could not read Jervis version")
          version = match.group(1)
          if not re.fullmatch(r"7\.\d+\.\d+", version):
              raise SystemExit("Release workflow only publishes Jervis 7.x")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + version + "\n")

  source:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build source packages and native bootstrap scripts
        run: |
          python -m pip install --upgrade build
          python -m build
          sh -n install.sh
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw install.ps1))"
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            install.sh
            install.ps1

  native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: jervis-linux-x64
          - os: ubuntu-24.04-arm
            asset: jervis-linux-arm64
          - os: windows-latest
            asset: jervis-windows-x64
          - os: macos-15-intel
            asset: jervis-macos-x64
          - os: macos-latest
            asset: jervis-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux audio build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng
      - name: Install native build environment
        run: python -m pip install . "pyinstaller>=6,<7"
      - name: Build native Jervis
        run: python scripts/build_native.py --name ${{ matrix.asset }}
      - name: Verify native Jervis
        run: python scripts/verify_native.py --path dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*

  publish:
    needs: [metadata, source, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release description exists
        shell: bash
        run: |
          test -f "docs/releases/${{ needs.metadata.outputs.version }}.md"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Build all-platforms download and checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("release")
          names = [
              "jervis-linux-x64",
              "jervis-linux-arm64",
              "jervis-windows-x64.exe",
              "jervis-macos-x64",
              "jervis-macos-arm64",
          ]
          with zipfile.ZipFile(
              root / "jervis-installer-all-platforms.zip",
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ) as bundle:
              for name in names:
                  path = root / name
                  if not path.exists():
                      raise SystemExit("Missing release asset: " + name)
                  bundle.write(path, name)
          PY
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: Jervis ${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          body_path: docs/releases/${{ needs.metadata.outputs.version }}.md
          generate_release_notes: false
          files: |
            release/*
